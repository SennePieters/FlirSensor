version: '3.8'

services:
  influxdb:
    image: influxdb:2.0
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=flironesensor
      - INFLUXDB_ADMIN_USER=senne
      - INFLUXDB_ADMIN_PASSWORD=12345678
    volumes:
      - influxdb-storage:/var/lib/influxdb

  flir_sensor_sim:
    build:
      context: .
      dockerfile: Dockerfile.sim
    depends_on:
      - influxdb

  flir_sensor:
    build:
      context: .
      dockerfile: dockerfile
    container_name: flir_sensor
    depends_on:
      - flir_sensor
    environment:
      - PATIENT_ID=123
    volumes:
      - ./SensorOutput:/SensorOutput

volumes:
  influxdb-storage:
