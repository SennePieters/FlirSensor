version: '3.8'

services:
  influxdb:
    image: influxdb:2.0
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=flironesensor
      - INFLUXDB_ADMIN_USER=senne
      - INFLUXDB_ADMIN_PASSWORD=12345678
    volumes:
      - influxdb-storage:/var/lib/influxdb

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  flir_sensor_sim:
    build:
      context: .
      dockerfile: dockerfile.sim
    container_name: flir_sensor_sim
    depends_on:
      - influxdb
    volumes:
      - ./SensorOutput:/app/SensorOutput

  flir_sensor:
    build:
      context: .
      dockerfile: dockerfile
    container_name: flir_sensor
    depends_on:
      - influxdb
    environment:
      - PATIENT_ID=123
    volumes:
      - ./SensorOutput:/app/SensorOutput

volumes:
  influxdb-storage:
  grafana-storage:
